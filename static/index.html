<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NCSA Interactive</title>
<style>
  :root {
    --bg: #0e0f12;
    --panel: #15181d;
    --panel-2: #1c2027;
    --text: #e5e7eb;
    --muted: #8b94a3;
    --accent: #7dd3fc;
    --accent-2: #38bdf8;
    --green: #3ec96b;
    --red: #e0492f;
    --dead: #1a1d22;
    --border: #2a2f38;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui,
                 "Helvetica Neue", Arial, sans-serif;
    font-size: 13px;
    height: 100%;
  }
  .layout {
    display: grid;
    grid-template-columns: 1fr 360px;
    grid-template-rows: auto 1fr;
    height: 100vh;
    gap: 12px;
    padding: 12px;
  }
  .controls-bar {
    grid-column: 1 / span 2;
    display: flex; align-items: center; gap: 10px;
    background: var(--panel);
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
  }
  button {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  button:hover { background: #232830; }
  button.primary { background: var(--accent-2); color: #0e0f12; border-color: var(--accent-2); }
  button.primary:hover { background: var(--accent); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .stat {
    display: inline-flex; gap: 6px; align-items: baseline;
    padding: 4px 10px;
    background: var(--panel-2);
    border-radius: 6px;
    border: 1px solid var(--border);
  }
  .stat .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
  .stat .value { font-variant-numeric: tabular-nums; }
  .stat .value.green { color: var(--green); }
  .stat .value.red { color: var(--red); }
  .spacer { flex: 1; }
  .grid-panel {
    background: var(--panel);
    border-radius: 8px;
    border: 1px solid var(--border);
    padding: 16px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    overflow: hidden;
  }
  canvas {
    image-rendering: pixelated;
    border: 1px solid var(--border);
    background: var(--dead);
    max-width: 100%;
    max-height: calc(100vh - 160px);
  }
  .side {
    background: var(--panel);
    border-radius: 8px;
    border: 1px solid var(--border);
    padding: 14px;
    overflow-y: auto;
  }
  .side h3 {
    margin: 8px 0 12px;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    font-weight: 600;
  }
  .field {
    display: grid;
    grid-template-columns: 1fr 78px;
    gap: 8px;
    align-items: center;
    margin-bottom: 10px;
  }
  .field label {
    color: var(--text);
    font-size: 12px;
  }
  .field input[type=range] {
    grid-column: 1 / span 2;
    width: 100%;
    accent-color: var(--accent-2);
  }
  .field input[type=number] {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 6px;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    width: 100%;
  }
  .field input[type=checkbox] {
    appearance: none;
    -webkit-appearance: none;
    width: 36px;
    height: 20px;
    background: var(--border);
    border-radius: 10px;
    position: relative;
    cursor: pointer;
    flex-shrink: 0;
    margin: 0 0 0 8px;
    transition: background 0.15s;
  }
  .field input[type=checkbox]::after {
    content: "";
    position: absolute;
    top: 2px; left: 2px;
    width: 16px; height: 16px;
    background: var(--text);
    border-radius: 50%;
    transition: transform 0.15s;
  }
  .field input[type=checkbox]:checked {
    background: var(--accent-2);
  }
  .field input[type=checkbox]:checked::after {
    transform: translateX(16px);
  }
  .field-header {
    display: flex; justify-content: space-between;
  }
  .legend {
    display: flex; gap: 12px; margin-top: 8px;
    font-size: 12px; color: var(--muted);
  }
  .legend .dot {
    display: inline-block; width: 10px; height: 10px;
    border-radius: 2px;
    vertical-align: middle; margin-right: 4px;
  }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .status-indicator {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--muted);
    display: inline-block;
    vertical-align: middle;
    margin-right: 6px;
  }
  .status-indicator.running { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .status-indicator.paused  { background: #facc15; }
  details.group {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    margin: 12px 0;
    background: var(--panel-2);
  }
  details.group summary {
    cursor: pointer;
    color: var(--muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .field.unused { opacity: 0.4; }
  .field select {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 6px;
    font-size: 12px;
    width: 100%;
    grid-column: 1 / span 2;
  }
  #env-overlay-controls {
    margin-top: 10px;
    font-size: 12px;
    color: var(--muted);
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  #env-overlay-controls label { cursor: pointer; }
  .field textarea {
    grid-column: 1 / span 2;
    width: 100%;
    min-height: 110px;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11px;
    resize: vertical;
  }
  .region-helper {
    margin: 8px 0 12px;
    font-size: 12px;
    color: var(--muted);
  }
  .region-helper .row { margin: 6px 0; }
  .region-helper input[type=number] {
    width: 56px;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 4px;
  }
  canvas.clickable { cursor: crosshair; }
</style>
</head>
<body>
<div class="layout">

  <!-- Top bar: controls and live stats -->
  <div class="controls-bar">
    <button id="btn-start" class="primary">Start</button>
    <button id="btn-pause">Pause</button>
    <button id="btn-reset">Reset</button>
    <div class="stat">
      <span class="label">Step</span>
      <span class="value" id="stat-step">0</span>
    </div>
    <div class="stat">
      <span class="label">Alive</span>
      <span class="value green" id="stat-alive">—</span>
    </div>
    <div class="stat">
      <span class="label">Dead</span>
      <span class="value" id="stat-dead">—</span>
    </div>
    <div class="stat">
      <span class="label">Repro</span>
      <span class="value green" id="stat-repro">—</span>
    </div>
    <div class="stat">
      <span class="label">Elim</span>
      <span class="value red" id="stat-elim">—</span>
    </div>
    <div class="stat">
      <span class="label">Loss R</span>
      <span class="value" id="stat-lossr">—</span>
    </div>
    <div class="stat">
      <span class="label">Loss E</span>
      <span class="value" id="stat-losse">—</span>
    </div>
    <div class="spacer"></div>
    <span class="status-indicator paused" id="status-dot"></span>
    <span id="status-text" style="color:var(--muted)">idle</span>
  </div>

  <!-- Grid canvas -->
  <div class="grid-panel">
    <canvas id="grid-canvas" width="400" height="400"></canvas>
    <div class="legend">
      <span><span class="dot" style="background:var(--green)"></span>reproducer alive</span>
      <span><span class="dot" style="background:var(--red)"></span>eliminator alive</span>
      <span><span class="dot" style="background:var(--dead);border:1px solid var(--border)"></span>dead</span>
    </div>
    <div class="legend" id="env-legend" hidden>
      <span><span class="dot" style="background:#3b82f6"></span>low κ</span>
      <span><span class="dot" style="background:#22d3ee"></span>high κ</span>
      <span><span class="dot" style="background:#f59e0b"></span>low η</span>
      <span><span class="dot" style="background:#a3e635"></span>high η</span>
      <span><span class="dot" style="background:#0a1220;border:1px solid var(--border)"></span>uninhabitable</span>
    </div>
    <div id="env-overlay-controls" hidden>
      Overlay:
      <label><input type="radio" name="env-overlay" value="off"> Off</label>
      <label><input type="radio" name="env-overlay" value="conductivity"> Conductivity</label>
      <label><input type="radio" name="env-overlay" value="learning"> Learning</label>
      <label><input type="radio" name="env-overlay" value="occupancy"> Occupancy</label>
      <label><input type="radio" name="env-overlay" value="combined"> Combined</label>
      <label><input type="radio" name="env-overlay" value="type-split"> Type-split κ</label>
      <span style="color:var(--muted)">Click grid to place a κ=0 disk</span>
    </div>
  </div>

  <!-- Sidebar: speed + config -->
  <div class="side">
    <h3>Playback</h3>
    <div class="field">
      <div class="field-header">
        <label for="speed-input">Steps / second</label>
        <span id="speed-display" style="color:var(--muted)">30</span>
      </div>
      <input id="speed-input" type="range" min="1" max="200" step="1" value="30">
    </div>

    <h3 style="margin-top:18px">Config</h3>
    <div id="config-fields"></div>

    <div class="row" style="margin-top:14px">
      <button id="btn-apply">Apply &amp; Reset</button>
      <button id="btn-save">Download .json</button>
    </div>
    <div id="config-error" style="color: var(--red); margin-top: 8px; min-height: 16px;"></div>
  </div>

</div>

<script>
//----------------------------------------------------------------------------
// Config field rendering -- driven by metadata from /api/config so this UI
// auto-adapts to new fields without code changes.
//----------------------------------------------------------------------------

let CFG_META = [];     // [{name,label,kind,min,max,step,group}]
let CFG_VALUES = {};   // current values
let CFG_CHOICES = {};  // from data.choices
let PRESET_KNOBS = {}; // from data.preset_knobs
let overlayMode = localStorage.getItem("ncsa.envOverlayMode") || "combined";
let envCache = null;   // {kappa, kappaR, kappaE, eta, etaR, etaE, occ, N, etaHi}

async function loadConfig() {
  const r = await fetch("/api/config");
  const data = await r.json();
  CFG_META = data.fields;
  CFG_VALUES = data.values;
  CFG_CHOICES = data.choices || {};
  PRESET_KNOBS = data.preset_knobs || {};
  renderConfig();
}

function makeField(f, v) {
  const wrap = document.createElement("div");
  wrap.className = "field";
  wrap.dataset.field = f.name;

  const header = document.createElement("div");
  header.className = "field-header";
  const lbl = document.createElement("label");
  lbl.textContent = f.label;
  lbl.htmlFor = `cfg-${f.name}`;
  header.appendChild(lbl);
  wrap.appendChild(header);

  if (f.kind === "json") {
    const ta = document.createElement("textarea");
    ta.id = `cfg-${f.name}`;
    ta.dataset.field = f.name;
    ta.dataset.kind = "json";
    if (v == null || v === "") {
      ta.value = "[]";
    } else if (typeof v === "string") {
      ta.value = v;
    } else {
      ta.value = JSON.stringify(v, null, 2);
    }
    ta.spellcheck = false;
    wrap.appendChild(ta);
    return wrap;
  }

  if (f.kind === "choice") {
    const sel = document.createElement("select");
    sel.id = `cfg-${f.name}`;
    sel.dataset.field = f.name;
    sel.dataset.kind = "choice";
    for (const opt of (CFG_CHOICES[f.name] || [])) {
      const o = document.createElement("option");
      o.value = opt;
      o.textContent = opt;
      if (String(opt) === String(v)) o.selected = true;
      sel.appendChild(o);
    }
    wrap.appendChild(sel);
    return wrap;
  }

  if (f.kind === "bool") {
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.id = `cfg-${f.name}`;
    cb.dataset.field = f.name;
    cb.dataset.kind = "bool";
    cb.checked = v === true || v === 1 || v === "1" || v === "true";
    header.appendChild(cb);
    return wrap;
  }

  const num = document.createElement("input");
  num.type = (f.kind === "intornone") ? "text" : "number";
  num.id = `cfg-${f.name}`;
  let numVal = v;
  if (typeof numVal === "boolean") numVal = numVal ? 1 : 0;
  num.value = (numVal === null || numVal === undefined) ? "" : numVal;
  num.dataset.field = f.name;
  num.dataset.kind = f.kind;
  if (f.kind !== "intornone") {
    num.min = f.min; num.max = f.max; num.step = f.step;
  }
  header.appendChild(num);

  if (f.kind !== "intornone") {
    const slider = document.createElement("input");
    slider.type = "range";
    slider.min = f.min; slider.max = f.max; slider.step = f.step;
    slider.value = (v === null || v === undefined) ? f.min : v;
    slider.dataset.target = `cfg-${f.name}`;
    slider.addEventListener("input", () => {
      num.value = slider.value;
    });
    num.addEventListener("input", () => {
      if (num.value !== "") slider.value = num.value;
    });
    wrap.appendChild(slider);
  }
  return wrap;
}

function applyPresetKnobGreyout() {
  const sel = document.getElementById("cfg-env_preset");
  const preset = sel ? sel.value : (CFG_VALUES.env_preset || "identity");
  const knobs = new Set(PRESET_KNOBS[preset] || []);
  for (const f of CFG_META) {
    if (f.group !== "Experiment G") continue;
    if (f.name === "environment_heterogeneous" || f.name === "env_preset" ||
        f.name === "env_seed" || f.name === "env_regions") continue;
    const el = document.querySelector(`.field[data-field="${f.name}"]`);
    if (!el) continue;
    el.classList.toggle("unused", knobs.size > 0 && !knobs.has(f.name));
  }
}

function renderConfig() {
  const root = document.getElementById("config-fields");
  root.innerHTML = "";
  let gDetails = null;
  for (const f of CFG_META) {
    const v = CFG_VALUES[f.name];
    const wrap = makeField(f, v);
    if (f.group === "Experiment G") {
      if (!gDetails) {
        gDetails = document.createElement("details");
        gDetails.className = "group";
        gDetails.id = "group-experiment-g";
        gDetails.open = true;
        const sum = document.createElement("summary");
        sum.textContent = "Experiment G";
        gDetails.appendChild(sum);
        root.appendChild(gDetails);
      }
      gDetails.appendChild(wrap);
    } else {
      root.appendChild(wrap);
    }
  }
  if (gDetails) renderRegionHelper(gDetails);
  const presetSel = document.getElementById("cfg-env_preset");
  if (presetSel) {
    presetSel.addEventListener("change", applyPresetKnobGreyout);
  }
  applyPresetKnobGreyout();
}

function renderRegionHelper(gDetails) {
  const box = document.createElement("div");
  box.className = "region-helper";
  box.innerHTML = `
    <div class="field-header"><label>Manual regions</label></div>
    <div class="row">
      <button type="button" id="btn-add-disk">Add disk</button>
      <button type="button" id="btn-add-rect">Add rect</button>
      <button type="button" id="btn-add-band">Add band</button>
      <button type="button" id="btn-clear-regions">Clear</button>
    </div>
    <div>
      Click the grid to drop a κ=0 disk.
      Radius <input id="env-paint-radius" type="number" min="0.5" max="40" step="0.5" value="3"> cells.
    </div>
  `;
  gDetails.appendChild(box);
  const bind = (id, fn) => {
    const el = document.getElementById(id);
    if (el) el.addEventListener("click", fn);
  };
  bind("btn-add-disk", () => appendRegion({
    shape: "disk", cy: 10, cx: 10, radius: 3, kappa_R: 0, kappa_E: 0,
  }));
  bind("btn-add-rect", () => appendRegion({
    shape: "rect", r0: 6, c0: 6, r1: 13, c1: 13, kappa_R: 0, kappa_E: 0,
  }));
  bind("btn-add-band", () => appendRegion({
    shape: "band", axis: "v", center: 10, width: 3, kappa_R: 0, kappa_E: 0,
  }));
  bind("btn-clear-regions", () => setRegions([]));
}

function getRegions() {
  const ta = document.getElementById("cfg-env_regions");
  if (!ta) return [];
  const raw = ta.value.trim();
  if (raw === "" || raw === "null") return [];
  try {
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : [];
  } catch (e) {
    return null;
  }
}

function setRegions(regions) {
  const ta = document.getElementById("cfg-env_regions");
  if (!ta) return;
  ta.value = JSON.stringify(regions, null, 2);
  ensureCustomPreset();
}

function appendRegion(region) {
  const regions = getRegions();
  if (regions === null) {
    setError("env_regions JSON is invalid; fix it before adding a region");
    return;
  }
  setError("");
  regions.push(region);
  setRegions(regions);
}

function ensureCustomPreset() {
  const flag = document.getElementById("cfg-environment_heterogeneous");
  const flagSlider = document.querySelector('input[type=range][data-target="cfg-environment_heterogeneous"]');
  const preset = document.getElementById("cfg-env_preset");
  if (flag) {
    if (flag.type === "checkbox") flag.checked = true;
    else flag.value = "1";
  }
  if (flagSlider) flagSlider.value = "1";
  if (preset) preset.value = "custom";
  applyPresetKnobGreyout();
}

function gridCellFromClick(ev) {
  const N = lastN || parseInt(CFG_VALUES.N, 10) || 0;
  if (N <= 0) return null;
  const rect = canvas.getBoundingClientRect();
  if (rect.width <= 0 || rect.height <= 0) return null;
  const j = Math.floor((ev.clientX - rect.left) / rect.width * N);
  const i = Math.floor((ev.clientY - rect.top) / rect.height * N);
  if (i < 0 || j < 0 || i >= N || j >= N) return null;
  return { i, j };
}

function collectConfig() {
  const out = {};
  for (const f of CFG_META) {
    const el = document.getElementById(`cfg-${f.name}`);
    if (!el) continue;
    if (f.kind === "bool") {
      out[f.name] = el.checked;
    } else if (f.kind === "intornone") {
      out[f.name] = (el.value === "") ? null : el.value;
    } else if (f.kind === "json") {
      out[f.name] = el.value.trim() === "" ? null : el.value;
    } else {
      out[f.name] = el.value;
    }
  }
  return out;
}

async function applyCurrentConfig() {
  setError("");
  const values = collectConfig();
  const r = await api("POST", "/api/config", { values, reset: true });
  if (r && r.ok === false) setError(r.error || "config invalid");
  return r;
}

//----------------------------------------------------------------------------
// Frame rendering
//----------------------------------------------------------------------------

const canvas = document.getElementById("grid-canvas");
const ctx = canvas.getContext("2d");

// Pre-compute the colour palette for the 3 cell states.
// 0 dead, 1 repro alive, 2 elim alive
const PALETTE_RGBA = new Uint8ClampedArray([
  0x1a, 0x1d, 0x22, 0xff,   // dead
  0x3e, 0xc9, 0x6b, 0xff,   // repro
  0xe0, 0x49, 0x2f, 0xff,   // elim
]);

let lastN = 0;
let imageData = null;

function decodeU8(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

function decodeEnv(frame) {
  return {
    N: frame.N,
    etaHi: frame.env_eta_hi || 1,
    kappa: decodeU8(frame.env_kappa_b64),
    kappaR: decodeU8(frame.env_kappa_r_b64),
    kappaE: decodeU8(frame.env_kappa_e_b64),
    eta: decodeU8(frame.env_eta_b64),
    etaR: decodeU8(frame.env_eta_r_b64),
    etaE: decodeU8(frame.env_eta_e_b64),
    occ: decodeU8(frame.env_occ_b64),
  };
}

function blend(buf, i, r, g, b, a) {
  if (a <= 0) return;
  const o = i * 4;
  const ia = 1 - a;
  buf[o]   = Math.round(r * a + buf[o]   * ia);
  buf[o+1] = Math.round(g * a + buf[o+1] * ia);
  buf[o+2] = Math.round(b * a + buf[o+2] * ia);
}

function compositeOverlay(buf, cache, mode) {
  const n = cache.N * cache.N;
  const etaHi = cache.etaHi;
  for (let i = 0; i < n; i++) {
    const occ = cache.occ[i] / 255;
    if (occ < 0.5 && (mode === "occupancy" || mode === "combined")) {
      buf[i*4] = 0x0a; buf[i*4+1] = 0x12; buf[i*4+2] = 0x20; buf[i*4+3] = 255;
      continue;
    }
    if (mode === "occupancy") continue;
    const kbar = 2 * cache.kappa[i] / 255;
    const ebar = etaHi * cache.eta[i] / 255;
    if (mode === "conductivity" || mode === "combined") {
      if (kbar < 1) blend(buf, i, 0x3b, 0x82, 0xf6, 0.50 * (1 - Math.min(kbar, 1)));
      if (kbar > 1) blend(buf, i, 0x22, 0xd3, 0xee, 0.30 * Math.min(kbar - 1, 1));
    }
    if (mode === "type-split") {
      const kR = 2 * cache.kappaR[i] / 255;
      const kE = 2 * cache.kappaE[i] / 255;
      blend(buf, i, 0x22, 0xc5, 0x5e, 0.45 * (1 - Math.min(kR, 1)));
      blend(buf, i, 0xe8, 0x79, 0xf9, 0.45 * (1 - Math.min(kE, 1)));
    }
    if (mode === "learning" || mode === "combined") {
      if (ebar < 1) blend(buf, i, 0xf5, 0x9e, 0x0b, 0.40 * (1 - Math.min(ebar, 1)));
      if (ebar > 1) {
        const span = Math.max(etaHi - 1, 1e-6);
        blend(buf, i, 0xa3, 0xe6, 0x35, 0.30 * Math.min((ebar - 1) / span, 1));
      }
    }
  }
}

function renderFrame(frame) {
  const N = frame.N;
  // Decode base64 grid bytes.
  const cells = decodeU8(frame.grid_b64);

  if (N !== lastN) {
    lastN = N;
    // Pick a sensible display size: aim for ~600px on the longest side.
    const target = 600;
    const cellSize = Math.max(1, Math.floor(target / N));
    canvas.width = N;
    canvas.height = N;
    canvas.style.width = (N * cellSize) + "px";
    canvas.style.height = (N * cellSize) + "px";
    imageData = ctx.createImageData(N, N);
  }

  const buf = imageData.data;
  for (let i = 0; i < cells.length; i++) {
    const k = cells[i] * 4;
    const o = i * 4;
    buf[o]   = PALETTE_RGBA[k];
    buf[o+1] = PALETTE_RGBA[k+1];
    buf[o+2] = PALETTE_RGBA[k+2];
    buf[o+3] = PALETTE_RGBA[k+3];
  }
  if (frame.env_kappa_b64) {
    envCache = decodeEnv(frame);
  }
  const envLegend = document.getElementById("env-legend");
  const envCtrls = document.getElementById("env-overlay-controls");
  if (frame.env_active) {
    envLegend.hidden = false;
    envCtrls.hidden = false;
    canvas.classList.add("clickable");
    if (overlayMode !== "off" && envCache) {
      compositeOverlay(buf, envCache, overlayMode);
    }
  } else {
    envLegend.hidden = true;
    envCtrls.hidden = true;
    canvas.classList.remove("clickable");
  }
  ctx.putImageData(imageData, 0, 0);

  // Update stats.
  document.getElementById("stat-step").textContent =
    frame.n_steps == null ? `${frame.step}` : `${frame.step} / ${frame.n_steps}`;
  document.getElementById("stat-alive").textContent = frame.alive;
  document.getElementById("stat-dead").textContent  = frame.dead;
  document.getElementById("stat-repro").textContent = frame.reproducer_alive;
  document.getElementById("stat-elim").textContent  = frame.eliminator_alive;
  document.getElementById("stat-lossr").textContent =
    frame.loss_reproduce_mean == null ? "—" : frame.loss_reproduce_mean.toFixed(3);
  document.getElementById("stat-losse").textContent =
    frame.loss_eliminate_mean == null ? "—" : frame.loss_eliminate_mean.toFixed(3);

  // Status indicator.
  const dot = document.getElementById("status-dot");
  const txt = document.getElementById("status-text");
  if (frame.running) {
    dot.className = "status-indicator running";
    txt.textContent = "running";
  } else {
    dot.className = "status-indicator paused";
    txt.textContent = (frame.n_steps != null && frame.step >= frame.n_steps) ? "finished" : "paused";
  }
}

//----------------------------------------------------------------------------
// WebSocket
//----------------------------------------------------------------------------

let ws = null;
function connectWS() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.addEventListener("message", (ev) => {
    try {
      const frame = JSON.parse(ev.data);
      if (frame.type === "frame") renderFrame(frame);
    } catch (e) { console.error(e); }
  });
  ws.addEventListener("close", () => {
    setTimeout(connectWS, 1000);
  });
  ws.addEventListener("error", (e) => console.warn("ws error", e));
}

//----------------------------------------------------------------------------
// Buttons / actions
//----------------------------------------------------------------------------

async function api(method, path, body) {
  const r = await fetch(path, {
    method,
    headers: { "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  return r.json().catch(() => ({}));
}

function setError(msg) {
  document.getElementById("config-error").textContent = msg || "";
}

document.getElementById("btn-start").addEventListener("click", () => api("POST", "/api/start"));
document.getElementById("btn-pause").addEventListener("click", () => api("POST", "/api/pause"));
document.getElementById("btn-reset").addEventListener("click", async () => {
  setError("");
  const values = collectConfig();
  const r = await api("POST", "/api/reset", { values });
  if (r && r.ok === false) setError(r.error || "reset failed");
});
document.getElementById("btn-apply").addEventListener("click", () => applyCurrentConfig());

canvas.addEventListener("click", async (ev) => {
  const cell = gridCellFromClick(ev);
  if (!cell) return;
  const radEl = document.getElementById("env-paint-radius");
  const radius = radEl ? Math.max(0.5, parseFloat(radEl.value) || 3) : 3;
  const regions = getRegions();
  if (regions === null) {
    setError("env_regions JSON is invalid; fix it before painting");
    return;
  }
  regions.push({
    shape: "disk", cy: cell.i, cx: cell.j, radius,
    kappa_R: 0, kappa_E: 0,
  });
  setRegions(regions);
  await applyCurrentConfig();
});
document.getElementById("btn-save").addEventListener("click", () => {
  // Trigger download via the server's stream endpoint (uses currently-applied config).
  window.location.href = "/api/config/download";
});

const speedInput = document.getElementById("speed-input");
const speedDisplay = document.getElementById("speed-display");
speedInput.addEventListener("input", () => {
  speedDisplay.textContent = speedInput.value;
});
speedInput.addEventListener("change", () => {
  api("POST", "/api/speed", { steps_per_second: parseFloat(speedInput.value) });
});

//----------------------------------------------------------------------------
// Boot
//----------------------------------------------------------------------------

document.querySelectorAll('input[name="env-overlay"]').forEach((el) => {
  if (el.value === overlayMode) el.checked = true;
  el.addEventListener("change", () => {
    if (!el.checked) return;
    overlayMode = el.value;
    localStorage.setItem("ncsa.envOverlayMode", overlayMode);
  });
});

(async function init() {
  await loadConfig();
  connectWS();
})();
</script>
